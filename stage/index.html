<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>open-annie</title>
<link rel="stylesheet" href="stage.css">
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/",
    "@pixiv/three-vrm": "/vendor/@pixiv/three-vrm/lib/three-vrm.module.min.js",
    "@pixiv/three-vrm-animation": "/vendor/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.min.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <header class="top">
    <div class="brand"><span class="dot"></span>open-annie</div>
  </header>

  <aside class="convo">
    <div class="msgs" id="msgs"></div>
  </aside>

  <div id="tags"></div>

  <div class="bar" id="bar">
    <canvas id="orb" width="112" height="112"></canvas>
    <div class="bar-mid"><canvas id="wave"></canvas></div>
  </div>


  <div class="card-overlay" id="title-card">
    <h1>open-annie</h1>
  </div>
  <div class="card-overlay" id="outro-card">
    <h1>open-annie</h1>
    <p id="outro-stats"></p>
    <div class="cta"><span>Apache-2.0</span><span>GPT-Live-1 × Jev</span><span>Broker on fal serverless</span></div>
  </div>

  <button id="play" class="play">Play the demo</button>
  <button id="end" class="end" hidden>结束会话</button>

  <div class="offline-notice" id="offline-notice" role="status" hidden>当前为离线导览，暂不支持自由问答</div>
</div>
<script type="module" src="stage.js"></script>
</body>
</html>
